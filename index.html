<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حاضنة أثق للأعمال | جاري التوجيه...</title>
    
    <!-- Automatic instant redirect -->
    <meta http-equiv="refresh" content="0; url=public/index.html">
    <link rel="canonical" href="public/index.html">

    <script>
        // Preserve query parameters and hash upon redirection
        var targetUrl = 'public/index.html' + window.location.search + window.location.hash;
        window.location.replace(targetUrl);
    </script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tajawal", sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .redirect-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5rem 2rem;
            border-radius: 1.25rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px var(--primary-glow);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            width: 52px;
            height: 52px;
            margin: 0 auto 1.5rem;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }

        .btn-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>منصة حاضنة أثق للأعمال</h1>
        <p>جاري تحويلك تلقائياً إلى واجهة المنصة الرئيسية...</p>
        <a id="redirect-link" href="public/index.html" class="btn-link">اضغط هنا إذا لم يتم التحويل تلقائياً</a>
    </div>

    <script>
        // Update direct link to include any query parameters or hash
        document.getElementById('redirect-link').href = targetUrl;
    </script>
</body>
</html>
