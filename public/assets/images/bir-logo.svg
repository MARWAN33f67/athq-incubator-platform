<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 85" width="190" height="85">
  <defs>
    <linearGradient id="birGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6E41"/>
      <stop offset="100%" stop-color="#08542E"/>
    </linearGradient>
    <linearGradient id="birGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A826"/>
      <stop offset="100%" stop-color="#DA9726"/>
    </linearGradient>
  </defs>

  <!-- Prophet's Mosque Minaret Emblem -->
  <g transform="translate(12, 10)">
    <!-- Crescent & Finial -->
    <path d="M 24,3 C 27,3 29,5 29,8 C 27,8 25,6 24,6 C 23,6 21,8 19,8 C 19,5 21,3 24,3 Z" fill="url(#birGoldGrad)"/>
    <circle cx="24" cy="10" r="2.2" fill="url(#birGoldGrad)"/>
    <!-- Dome / Canopy -->
    <path d="M 21,12 L 27,12 L 25.5,17 L 22.5,17 Z" fill="url(#birGoldGrad)"/>
    <!-- Minaret Tower Body -->
    <rect x="22.5" y="17" width="3" height="44" fill="url(#birGoldGrad)" rx="1"/>
    <!-- Balconies -->
    <rect x="20" y="31" width="8" height="2.5" fill="url(#birGoldGrad)" rx="0.5"/>
    <rect x="19.5" y="45" width="9" height="2.5" fill="url(#birGoldGrad)" rx="0.5"/>
    <!-- Palm Leaf Swirl Arc -->
    <path d="M 26,17 C 45,27 43,54 18,59 C 32,54 36,36 26,17 Z" fill="url(#birGreenGrad)"/>
  </g>

  <!-- Official Typography -->
  <g transform="translate(62, 18)">
    <text x="0" y="20" font-family="'Alexandria', 'Cairo', sans-serif" font-size="16" font-weight="900" fill="#0E6E41">جمعية البر</text>
    <text x="0" y="36" font-family="'Tajawal', sans-serif" font-size="12" font-weight="700" fill="#1C3026">بالمدينة المنورة</text>
    <text x="0" y="50" font-family="'Tajawal', sans-serif" font-size="10" font-weight="600" fill="#DA9726">تأسست 1379هـ • ترخيص (22)</text>
  </g>
</svg>
