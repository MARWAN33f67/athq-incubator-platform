<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 95" width="320" height="95">
  <defs>
    <!-- Athq Authentic Booklets Brand Gradients -->
    <linearGradient id="athqGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6E41"/>
      <stop offset="100%" stop-color="#08542E"/>
    </linearGradient>

    <linearGradient id="athqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A826"/>
      <stop offset="60%" stop-color="#DA9726"/>
      <stop offset="100%" stop-color="#BA7B15"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E6E41" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Athq Emblem (Left) -->
  <g transform="translate(15, 6)" filter="url(#softGlow)">
    <!-- Outer Golden Swoop (Crescent surrounding right side) -->
    <path d="M 44,5 C 64,13 75,32 71,55 C 68,71 58,82 43,86 C 55,80 62,69 63,55 C 65,37 56,21 44,5 Z" 
          fill="url(#athqGold)"/>

    <!-- Left Green Spathe/Frond (Curving leaf on the left) -->
    <path d="M 41,7 C 23,18 13,38 17,61 C 20,76 31,84 44,86 C 32,82 25,72 24,59 C 22,41 30,22 41,7 Z" 
          fill="url(#athqGreen)"/>

    <!-- The 3 Date Fruit Drops inside (Athq) -->
    <!-- Top-left drop (Green) -->
    <path d="M 33,29 C 38,27 41,31 39,36 C 37,40 31,41 30,36 C 29,32 31,29 33,29 Z" 
          fill="#0E6E41"/>
    <!-- Middle-right drop (Gold) -->
    <path d="M 48,37 C 53,35 56,39 54,44 C 52,49 45,50 44,45 C 43,40 45,37 48,37 Z" 
          fill="url(#athqGold)"/>
    <!-- Bottom drop (Green) -->
    <path d="M 39,52 C 44,50 47,54 45,59 C 43,64 36,64 35,59 C 34,55 36,52 39,52 Z" 
          fill="#08542E"/>
    <!-- Tiny golden spark -->
    <circle cx="49" cy="26" r="2.2" fill="#E5A826"/>
  </g>

  <!-- Official Typography (Right) -->
  <g transform="translate(100, 14)">
    <!-- Main Calligraphic Name "عَـذْق" -->
    <text x="205" y="40" 
          font-family="'Alexandria', 'Cairo', 'Tajawal', sans-serif" 
          font-size="38" 
          font-weight="900" 
          letter-spacing="-0.5px"
          text-anchor="end" 
          fill="url(#athqGold)">عَـذْق</text>

    <!-- Subtitle: حاضنة ومسرعة أعمال -->
    <text x="205" y="60" 
          font-family="'Alexandria', 'Cairo', 'Tajawal', sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.2px"
          text-anchor="end" 
          fill="#0E6E41">حاضنة ومسرعة أعمال</text>

    <!-- Affiliation badge: جمعية البر بالمدينة المنورة -->
    <text x="205" y="75" 
          font-family="'Tajawal', 'Cairo', sans-serif" 
          font-size="10" 
          font-weight="600" 
          text-anchor="end" 
          fill="#62786D">جمعية البر بالمدينة المنورة • ترخيص (22)</text>
  </g>
</svg>
